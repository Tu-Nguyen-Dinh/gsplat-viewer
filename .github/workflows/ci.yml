name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install GLFW build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: CPU tests (GPU tests need a display and are skipped on CI)
        run: ctest --test-dir build -R cpu_tests --output-on-failure

  linux-sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer: turns silent memory bugs into a report with a stack trace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install GLFW build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGLFW_BUILD_WAYLAND=OFF "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j 4 --target gsplat_tests
      - name: CPU tests
        run: ./build/gsplat_tests --cpu-only

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: CPU tests (no GPU on hosted runners)
        run: ctest --test-dir build -R cpu_tests --output-on-failure

  android:
    # The phone app: the core and the NativeActivity library cross-compiled with the runner's NDK,
    # and every shader checked as GLSL ES 3.10 by the reference compiler (glslc) shipped with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install GLFW build dependencies (for the shader dump tool)
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
      - name: Shaders compile as GLSL ES 3.10
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF -DGSV_BUILD_TESTS=OFF
          cmake --build build -j 4 --target gsplat_shaderdump
          ./build/gsplat_shaderdump es-shaders --es
          GLSLC="$ANDROID_NDK_LATEST_HOME/shader-tools/linux-x86_64/glslc"
          for f in es-shaders/*; do
            "$GLSLC" --target-env=opengl -std=310es -fauto-map-locations -fauto-bind-uniforms -o /dev/null "$f"
            echo "ok $f"
          done
      - name: Build the Android library (arm64-v8a)
        run: |
          cmake -S . -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29
          cmake --build build-android -j 4 --target gsplat_android
